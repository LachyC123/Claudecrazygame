<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>BORDERLINE 4</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0908'/%3E%3Cpath d='M6 22 L16 7 L26 22 Z' fill='%23ffb020' stroke='%23000' stroke-width='2'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="/fonts/fonts.css" />
<style>
  html,body{margin:0;padding:0;height:100%;background:#0a0908;overflow:hidden;
    font-family:'Oswald','Saira Condensed',system-ui,sans-serif;color:#fff}
  #app{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%}
  #ui{position:fixed;inset:0;pointer-events:none;z-index:10}
  #boot{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:18px;background:radial-gradient(circle at 50% 45%,#1b1a17,#08070a 70%)}
  #boot.hide{opacity:0;pointer-events:none;transition:opacity .6s ease}
  #boot h1{font-family:'Anton',sans-serif;font-size:clamp(40px,9vw,120px);letter-spacing:.06em;margin:0;
    text-transform:uppercase;-webkit-text-stroke:3px #000;color:#ffb020;
    text-shadow:0 6px 0 #000,0 0 40px rgba(255,150,20,.4)}
  #bar{width:min(420px,60vw);height:14px;border:3px solid #000;background:#221f1c;transform:skewX(-12deg)}
  #barfill{height:100%;width:0%;background:linear-gradient(90deg,#ff8a00,#ffd050);transition:width .2s}
  #boothint{font-family:system-ui,sans-serif;font-size:13px;letter-spacing:.18em;color:#8e8677;text-transform:uppercase}
</style>
</head>
<body>
<div id="app"></div>
<div id="ui"></div>
<div id="boot">
  <h1>Borderline 4</h1>
  <div id="bar"><div id="barfill"></div></div>
  <div id="boothint">forging the wasteland…</div>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
